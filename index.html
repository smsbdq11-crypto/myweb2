<!DOCTYPE html>
<html>

<head>
    <title>🎁GIFT FOR YOU🎁</title>

    <style>

        body {
            background-color: pink;
            text-align: center;
            font-family: Arial;
            padding-top: 100px;
        }

        h1 {
            color: purple;
            font-size: 40px;
        }

        #gift {
            font-size: 120px;
            cursor: pointer;
        }

        #message {
            display: none;
            background-color: white;
            padding: 30px;
            margin: 30px auto;
            width: 550px;
            border-radius: 20px;
            font-size: 20px;
               color: red;
        }

        /* مكان الفرقعة */
        #confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        /* الأشياء المتطايرة */
        .confetti-piece {
            position: absolute;
            font-size: 30px;
            animation: explode 1.5s ease-out forwards;
        }

        /* حركة الفرقعة */
        @keyframes explode {

            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }

            100% {
                transform: translate(var(--x), var(--y))
                           rotate(360deg)
                           scale(0.5);
                opacity: 0;
            }

        }

    </style>
</head>


<body>

    <h1>🎁I HAVE A GIFT FOR YOU🎁</h1>

    <div id="gift" onclick="openGift()">🎁</div>


    <div id="message">

        <h2>💌MASSAGE FOR YOU💌</h2>

        <p>
    
          🤍I LOOOOOOOOOOOOOOOOOOOOOOOOOOOVE U🤍
        </p>

    </div>


    <!-- مكان ظهور الفرقعة -->

    <div id="confetti"></div>


    <script>

        function openGift() {

            // إخفاء الهدية
            document.getElementById("gift").style.display = "none";

            // إظهار الرسالة
            document.getElementById("message").style.display = "block";

            // تشغيل الفرقعة
            createConfetti();

        }


        function createConfetti() {

            const confetti =
                document.getElementById("confetti");

            const items = [
                "💖",
                "✨",
                "💕",
                "⭐",
                "🎉",
                "💗"
            ];


            // مكان بداية الفرقعة

            const centerX =
                window.innerWidth / 2;

            const centerY = 200;


            // عدد الأشياء المتطايرة

            for (let i = 0; i < 30; i++) {

                const piece =
                    document.createElement("span");


                piece.className =
                    "confetti-piece";


                // اختيار شكل عشوائي

                piece.textContent =
                    items[
                        Math.floor(
                            Math.random() * items.length
                        )
                    ];


                // مكان البداية

                piece.style.left =
                    centerX + "px";

                piece.style.top =
                    centerY + "px";


                // اتجاه الطيران

                piece.style.setProperty(
                    "--x",
                    (Math.random() * 600 - 300) + "px"
                );


                piece.style.setProperty(
                    "--y",
                    (Math.random() * 500 - 250) + "px"
                );


                // إضافة العنصر للصفحة

                confetti.appendChild(piece);

            }

        }

    </script>

</body>

</html>
